<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Practice Player</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="wrap">
    <div class="player-top">
      <button type="button" class="ghost" id="homeBtn">← Home</button>
      <a class="ghost" id="hubLink" href="#" style="display:none">Song hub</a>
      <h1 id="title">Practice player</h1>
      <div class="transport">
        <button class="primary" id="playBtn" type="button">Play</button>
        <button id="stopBtn" type="button">Stop</button>
        <label class="speed-wrap">
          <span>Speed</span>
          <select id="speedSel" title="Playback speed">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="0.85">0.85×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
          </select>
        </label>
        <button type="button" id="hqSpeedBtn" class="hq-toggle" title="Off = instant browser slowdown. On = Rubber Band HQ (first time may take a while)">HQ speed: Off</button>
        <button id="resetBtn" type="button">Reset mix</button>
        <button id="downloadBtn" type="button" title="Download current mix as MP3">Download mix</button>
        <button id="downloadStemsBtn" type="button" title="Download all stems as a ZIP folder">Download stems</button>
      </div>
    </div>

    <div class="card">
      <div class="seek-row">
        <span class="time" id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" />
        <span class="time" id="tDur">0:00</span>
      </div>

      <div class="presets" id="presets"></div>
      <div class="stems" id="stems"></div>
      <div class="footer-note" id="status">Loading stems…</div>
    </div>
  </div>

  <script>
    const BOOT = __BOOT_JSON__;

    const STEM_ORDER = BOOT.stem_order || ["vocals", "drums", "bass", "guitar", "piano", "other"];
    const PRESETS = [
      { id: "all", label: "All on", mute: [] },
      { id: "guitarist", label: "Guitarist", mute: ["guitar"] },
      { id: "drummer", label: "Drummer", mute: ["drums"] },
      { id: "singer", label: "Singer", mute: ["vocals"] },
      { id: "bassist", label: "Bassist", mute: ["bass"] },
      { id: "pianist", label: "Pianist", mute: ["piano"] },
      { id: "karaoke", label: "Karaoke", mute: ["vocals"] },
    ];

    const tracks = {}; // name -> { audio, muted, solo, vol, originalSrc }
    let playing = false;
    let activePreset = "all";
    let seeking = false;
    let syncTimer = null;
    let uiTimer = null;
    let playbackRate = 1;
    let hqSpeed = 1; // speed baked into loaded stem files (1 = originals)
    let stretchBusy = false;
    let hqEnabled = false; // user toggle: Rubber Band HQ vs instant browser rate

    const playBtn = document.getElementById("playBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resetBtn = document.getElementById("resetBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const downloadStemsBtn = document.getElementById("downloadStemsBtn");
    const speedSel = document.getElementById("speedSel");
    const hqSpeedBtn = document.getElementById("hqSpeedBtn");
    const seekEl = document.getElementById("seek");
    const tCur = document.getElementById("tCur");
    const tDur = document.getElementById("tDur");
    const statusEl = document.getElementById("status");

    function fmt(sec) {
      if (!isFinite(sec) || sec < 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ":" + String(s).padStart(2, "0");
    }

    function setStatus(msg) {
      statusEl.textContent = msg || "";
    }

    function syncHqButton() {
      if (!hqSpeedBtn) return;
      hqSpeedBtn.classList.toggle("on", hqEnabled);
      hqSpeedBtn.textContent = hqEnabled ? "HQ speed: On" : "HQ speed: Off";
    }

    function originalStemMap() {
      const orig = {};
      for (const [name, t] of Object.entries(tracks)) orig[name] = t.originalSrc;
      return orig;
    }

    function applyRate() {
      // When HQ stems are loaded for this speed, play at 1× (stretch already applied)
      const rate = hqEnabled && hqSpeed === playbackRate ? 1 : playbackRate;
      for (const t of Object.values(tracks)) {
        t.audio.playbackRate = rate;
        try {
          t.audio.preservesPitch = true;
          t.audio.mozPreservesPitch = true;
          t.audio.webkitPreservesPitch = true;
        } catch (_) {}
      }
    }

    function currentRatio() {
      const a = masterAudio();
      const dur = duration();
      if (!a || !(dur > 0)) return 0;
      return Math.max(0, Math.min(1, (a.currentTime || 0) / dur));
    }

    async function loadStemUrls(stemMap, keepRatio) {
      const ratio = keepRatio ? currentRatio() : 0;
      const wasPlaying = playing;
      if (wasPlaying) pauseAll();
      const loads = [];
      for (const [name, url] of Object.entries(stemMap)) {
        if (!tracks[name]) continue;
        const a = tracks[name].audio;
        a.src = url;
        loads.push(
          new Promise((resolve) => {
            const done = () => {
              a.removeEventListener("loadedmetadata", done);
              a.removeEventListener("error", done);
              resolve();
            };
            a.addEventListener("loadedmetadata", done);
            a.addEventListener("error", done);
            a.load();
          })
        );
      }
      await Promise.all(loads);
      applyRate();
      if (keepRatio) seekToRatio(ratio);
      else updateSeekUI();
      if (wasPlaying) await playAll();
    }

    async function restoreOriginalStems(statusMsg) {
      if (hqSpeed === 1) {
        applyRate();
        if (statusMsg) setStatus(statusMsg);
        return;
      }
      stretchBusy = true;
      speedSel.disabled = true;
      if (hqSpeedBtn) hqSpeedBtn.disabled = true;
      setStatus("Restoring 1× stems…");
      try {
        await loadStemUrls(originalStemMap(), true);
        hqSpeed = 1;
        if (statusMsg) setStatus(statusMsg);
      } catch (e) {
        setStatus("Restore failed: " + e.message);
      } finally {
        stretchBusy = false;
        speedSel.disabled = false;
        if (hqSpeedBtn) hqSpeedBtn.disabled = false;
      }
    }

    async function prepareHqStretch(next) {
      stretchBusy = true;
      speedSel.disabled = true;
      if (hqSpeedBtn) hqSpeedBtn.disabled = true;
      setStatus("Preparing HQ " + next + "× (Rubber Band when available)…");
      try {
        const res = await fetch("/api/jobs/" + encodeURIComponent(BOOT.job_id) + "/stretch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ speed: next }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || res.statusText);
        await loadStemUrls(data.stems || {}, true);
        hqSpeed = next;
        const eng = data.engine || "unknown";
        setStatus(
          "HQ " + next + "× via " + eng +
            (eng === "atempo" ? " (install rubberband for better quality)" : "") +
            " — faders still work."
        );
      } catch (e) {
        hqSpeed = 1;
        try { await loadStemUrls(originalStemMap(), true); } catch (_) {}
        applyRate();
        setStatus("HQ stretch failed (" + e.message + ") — using browser slowdown.");
      } finally {
        stretchBusy = false;
        speedSel.disabled = false;
        if (hqSpeedBtn) hqSpeedBtn.disabled = false;
      }
    }

    async function setSpeed(rate) {
      const next = Math.max(0.25, Math.min(2, Number(rate) || 1));
      playbackRate = next;
      if (speedSel) speedSel.value = String(playbackRate);
      if (!BOOT.job_id || stretchBusy) {
        applyRate();
        return;
      }
      applyRate();

      if (Math.abs(next - 1) < 1e-6) {
        await restoreOriginalStems("Playing at 1×");
        return;
      }

      if (!hqEnabled) {
        // Instant browser slowdown (no server processing)
        if (hqSpeed !== 1) await restoreOriginalStems();
        applyRate();
        setStatus("Playing at " + next + "× (browser — turn on HQ speed for better quality).");
        return;
      }

      await prepareHqStretch(next);
    }

    async function toggleHqSpeed() {
      if (stretchBusy) return;
      hqEnabled = !hqEnabled;
      syncHqButton();
      if (!BOOT.job_id) return;

      if (!hqEnabled) {
        // Switch to instant mode: unload HQ files if loaded
        await restoreOriginalStems(
          Math.abs(playbackRate - 1) < 1e-6
            ? "HQ speed Off"
            : "HQ speed Off — using browser " + playbackRate + "×"
        );
        applyRate();
        return;
      }

      // HQ On: if not at 1×, process now
      if (Math.abs(playbackRate - 1) < 1e-6) {
        setStatus("HQ speed On — pick a speed other than 1× to process.");
        return;
      }
      await prepareHqStretch(playbackRate);
    }

    function mixPayload() {
      const volumes = {};
      const muted = {};
      const solo = {};
      for (const [name, t] of Object.entries(tracks)) {
        volumes[name] = t.vol;
        muted[name] = !!t.muted;
        solo[name] = !!t.solo;
      }
      return { volumes, muted, solo, speed: playbackRate };
    }

    async function saveDownload(res, fallbackName) {
      if (!res.ok) {
        let msg = res.statusText;
        try {
          const j = await res.json();
          msg = j.detail || msg;
        } catch (_) {
          try { msg = await res.text(); } catch (__) {}
        }
        throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      }
      const blob = await res.blob();
      const cd = res.headers.get("Content-Disposition") || "";
      const m = /filename=\"?([^\";]+)\"?/.exec(cd);
      const fname = (m && m[1]) || fallbackName;
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      return fname;
    }

    async function downloadMix() {
      if (!BOOT.job_id) return;
      downloadBtn.disabled = true;
      setStatus("Rendering mix MP3…");
      try {
        const res = await fetch("/api/jobs/" + encodeURIComponent(BOOT.job_id) + "/export", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(mixPayload()),
        });
        const fname = await saveDownload(res, "mix.mp3");
        setStatus("Downloaded " + fname + " (" + playbackRate + "×, current mute/vols).");
      } catch (e) {
        setStatus("Download failed: " + e.message);
      } finally {
        downloadBtn.disabled = false;
      }
    }

    async function downloadStems() {
      if (!BOOT.job_id) return;
      downloadStemsBtn.disabled = true;
      setStatus("Packing stems ZIP…");
      try {
        const res = await fetch(
          "/api/jobs/" + encodeURIComponent(BOOT.job_id) + "/stems.zip"
        );
        const fname = await saveDownload(res, "stems.zip");
        setStatus("Downloaded " + fname + " (folder with all stem MP3s).");
      } catch (e) {
        setStatus("Download stems failed: " + e.message);
      } finally {
        downloadStemsBtn.disabled = false;
      }
    }

    function anySolo() {
      return Object.values(tracks).some((t) => t.solo);
    }

    function applyAudibility() {
      const soloing = anySolo();
      for (const t of Object.values(tracks)) {
        t.audio.muted = t.muted || (soloing && !t.solo);
        t.audio.volume = Math.min(1, Math.max(0, t.vol));
      }
      refreshButtons();
    }

    function masterAudio() {
      const names = STEM_ORDER.filter((n) => tracks[n]);
      return names.length ? tracks[names[0]].audio : null;
    }

    function duration() {
      const a = masterAudio();
      return a && isFinite(a.duration) ? a.duration : 0;
    }

    function clearTimers() {
      if (syncTimer) clearInterval(syncTimer);
      if (uiTimer) clearInterval(uiTimer);
      syncTimer = uiTimer = null;
    }

    function startTimers() {
      clearTimers();
      syncTimer = setInterval(() => {
        const list = Object.values(tracks);
        if (!list.length || !playing) return;
        const master = list[0].audio;
        for (let i = 1; i < list.length; i++) {
          const a = list[i].audio;
          if (Math.abs(a.currentTime - master.currentTime) > 0.08) {
            a.currentTime = master.currentTime;
          }
        }
      }, 400);
      uiTimer = setInterval(updateSeekUI, 200);
    }

    function updateSeekUI() {
      if (seeking) return;
      const a = masterAudio();
      if (!a) return;
      const dur = duration();
      tDur.textContent = fmt(dur);
      tCur.textContent = fmt(a.currentTime || 0);
      if (dur > 0) seekEl.value = String(Math.round((a.currentTime / dur) * 1000));
    }

    async function playAll() {
      const list = Object.values(tracks);
      if (!list.length) return;
      applyAudibility();
      try {
        applyRate();
        await Promise.all(list.map((t) => t.audio.play()));
        playing = true;
        playBtn.textContent = "Pause";
        startTimers();
        setStatus("Playing at " + playbackRate + "×" + (hqEnabled && hqSpeed === playbackRate && playbackRate !== 1 ? " HQ" : "") + " — drag faders to practice.");
      } catch (e) {
        playing = false;
        playBtn.textContent = "Play";
        setStatus("Play failed: " + e);
      }
    }

    function pauseAll() {
      for (const t of Object.values(tracks)) t.audio.pause();
      playing = false;
      playBtn.textContent = "Play";
      clearTimers();
      setStatus("Paused");
    }

    function stopAll() {
      for (const t of Object.values(tracks)) {
        t.audio.pause();
        t.audio.currentTime = 0;
      }
      playing = false;
      playBtn.textContent = "Play";
      clearTimers();
      updateSeekUI();
      setStatus("Stopped");
    }

    function togglePlay() {
      if (playing) pauseAll();
      else playAll();
    }

    function seekToRatio(ratio) {
      const dur = duration();
      if (!(dur > 0)) return;
      const t = Math.max(0, Math.min(dur, ratio * dur));
      for (const tr of Object.values(tracks)) tr.audio.currentTime = t;
      updateSeekUI();
    }

    function refreshButtons() {
      for (const name of Object.keys(tracks)) {
        const muteBtn = document.getElementById("mute-" + name);
        const soloBtn = document.getElementById("solo-" + name);
        if (muteBtn) muteBtn.classList.toggle("on", tracks[name].muted);
        if (soloBtn) soloBtn.classList.toggle("on", tracks[name].solo);
      }
      document.querySelectorAll(".presets button").forEach((el) => {
        el.classList.toggle("on", el.dataset.id === activePreset);
      });
    }

    function applyPreset(id) {
      const p = PRESETS.find((x) => x.id === id);
      if (!p) return;
      activePreset = id;
      for (const [name, t] of Object.entries(tracks)) {
        t.muted = p.mute.includes(name);
        t.solo = false;
      }
      applyAudibility();
    }

    function render() {
      document.getElementById("title").textContent = BOOT.title || "Practice player";
      document.title = (BOOT.title || "Player") + " · Practice Stems";
      const hub = document.getElementById("hubLink");
      if (hub && BOOT.hub_url) {
        hub.href = BOOT.hub_url;
        hub.style.display = "";
      }

      const presetsEl = document.getElementById("presets");
      presetsEl.innerHTML = "";
      for (const p of PRESETS) {
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.id = p.id;
        b.textContent = p.label;
        b.onclick = () => applyPreset(p.id);
        presetsEl.appendChild(b);
      }

      const stemsEl = document.getElementById("stems");
      stemsEl.innerHTML = "";
      for (const name of STEM_ORDER) {
        if (!tracks[name]) continue;
        const row = document.createElement("div");
        row.className = "stem";
        row.innerHTML =
          '<div class="name">' + name + "</div>" +
          '<input type="range" min="0" max="1" step="0.01" value="' + tracks[name].vol + '" id="vol-' + name + '" />' +
          '<div class="vol" id="volval-' + name + '">100%</div>' +
          '<button type="button" class="mute" id="mute-' + name + '">Mute</button>' +
          '<button type="button" class="solo" id="solo-' + name + '">Solo</button>';
        stemsEl.appendChild(row);

        document.getElementById("vol-" + name).oninput = (e) => {
          tracks[name].vol = parseFloat(e.target.value);
          document.getElementById("volval-" + name).textContent =
            Math.round(tracks[name].vol * 100) + "%";
          activePreset = "";
          applyAudibility();
        };
        document.getElementById("mute-" + name).onclick = () => {
          tracks[name].muted = !tracks[name].muted;
          if (tracks[name].muted) tracks[name].solo = false;
          activePreset = "";
          applyAudibility();
        };
        document.getElementById("solo-" + name).onclick = () => {
          tracks[name].solo = !tracks[name].solo;
          if (tracks[name].solo) tracks[name].muted = false;
          activePreset = "";
          applyAudibility();
        };
      }
      refreshButtons();
    }

    function init() {
      const stemMap = BOOT.stems || {};
      const names = STEM_ORDER.filter((n) => stemMap[n]);
      if (!names.length) {
        setStatus("No stems found for this job.");
        playBtn.disabled = true;
        return;
      }

      for (const name of names) {
        const audio = new Audio();
        audio.preload = "auto";
        audio.src = stemMap[name];
        audio.addEventListener("ended", () => {
          // When master ends, stop all
          if (name === names[0]) stopAll();
        });
        tracks[name] = { audio, muted: false, solo: false, vol: 1, originalSrc: stemMap[name] };
      }

      // Enable Play immediately — don't wait for full buffer
      playBtn.disabled = false;
      stopBtn.disabled = false;
      resetBtn.disabled = false;
      downloadBtn.disabled = false;
      downloadStemsBtn.disabled = false;
      speedSel.disabled = false;
      if (hqSpeedBtn) hqSpeedBtn.disabled = false;
      syncHqButton();
      applyRate();
      render();
      applyAudibility();
      setStatus("Ready — " + names.length + " stems. HQ speed is Off (instant). Turn On for Rubber Band quality.");

      // Update duration when metadata arrives
      const master = tracks[names[0]].audio;
      master.addEventListener("loadedmetadata", updateSeekUI);
    }

    function teardownAndGoHome() {
      // Unload audio so navigation isn't blocked by buffering
      try {
        clearTimers();
        for (const t of Object.values(tracks)) {
          t.audio.pause();
          t.audio.removeAttribute("src");
          t.audio.load();
        }
      } catch (_) {}
      window.location.replace("/");
    }

    playBtn.onclick = togglePlay;
    stopBtn.onclick = stopAll;
    resetBtn.onclick = () => applyPreset("all");
    downloadBtn.onclick = downloadMix;
    downloadStemsBtn.onclick = downloadStems;
    speedSel.onchange = () => setSpeed(speedSel.value);
    if (hqSpeedBtn) hqSpeedBtn.onclick = toggleHqSpeed;
    document.getElementById("homeBtn").onclick = teardownAndGoHome;

    seekEl.addEventListener("pointerdown", () => { seeking = true; });
    seekEl.addEventListener("pointerup", () => {
      seeking = false;
      seekToRatio(parseInt(seekEl.value, 10) / 1000);
    });
    seekEl.addEventListener("change", () => {
      seekToRatio(parseInt(seekEl.value, 10) / 1000);
      seeking = false;
    });

    init();
  </script>
</body>
</html>
