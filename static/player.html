<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Practice Player</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="wrap">
    <div class="player-top">
      <div class="player-nav">
        <button type="button" class="ghost" id="homeBtn">← Home</button>
        <a class="ghost" id="hubLink" href="#" style="display:none">Song hub</a>
      </div>
      <h1 id="title">Practice player</h1>
      <div class="transport">
        <div class="transport-primary">
          <button class="primary" id="playBtn" type="button">Play</button>
          <button id="stopBtn" type="button">Stop</button>
          <label class="speed-wrap">
            <span>Speed</span>
            <select id="speedSel" title="Playback speed">
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="0.85">0.85×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
            </select>
          </label>
          <div class="key-wrap" title="Transpose while playing. Shows song key name when known.">
            <span>Key</span>
            <button type="button" id="keyDownBtn" aria-label="Lower key">−</button>
            <span class="key-val" id="keyVal">—</span>
            <button type="button" id="keyUpBtn" aria-label="Raise key">+</button>
          </div>
        </div>
        <div class="transport-secondary">
          <button type="button" id="hqSpeedBtn" class="hq-toggle" title="Off = instant browser slowdown. On = Rubber Band HQ (first time may take a while)">HQ speed: Off</button>
          <button type="button" id="metroBtn" class="hq-toggle" title="Click track locked to song BPM">Metronome: Off</button>
          <button type="button" id="metroSettingsBtn" title="Metronome volume, sound, meter">Metro settings</button>
          <span class="metro-bpm" id="metroBpm" title="Detected tempo">— BPM</span>
          <label class="speed-wrap" title="Used when running stem separation">
            <span>Device</span>
            <select id="deviceSel">
              <option value="auto">Auto</option>
              <option value="cpu">CPU</option>
            </select>
          </label>
          <button id="resetBtn" type="button">Reset mix</button>
          <button id="downloadBtn" type="button" title="Download current mix as MP3">Download mix</button>
          <button id="downloadStemsBtn" type="button" title="Download all stems as a ZIP folder">Download stems</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="metro-panel" id="metroPanel" hidden>
        <div class="metro-panel-head">
          <strong>Metronome settings</strong>
          <button type="button" class="ghost" id="metroPanelClose">Close</button>
        </div>
        <div class="metro-panel-grid">
          <label class="metro-field">
            <span>Volume</span>
            <input type="range" id="metroVol" min="0" max="1" step="0.05" value="0.85" />
            <span class="metro-val" id="metroVolVal">85%</span>
          </label>
          <label class="metro-field">
            <span>Sound</span>
            <select id="metroSound">
              <option value="beep">Beep (loud)</option>
              <option value="wood" selected>Wood block</option>
              <option value="tick">Tick</option>
            </select>
          </label>
          <label class="metro-field">
            <span>Meter</span>
            <select id="meterSel">
              <option value="4">4/4</option>
              <option value="3">3/4</option>
              <option value="2">2/4</option>
              <option value="6">6/8</option>
            </select>
          </label>
          <label class="metro-field metro-check">
            <input type="checkbox" id="metroAccent" checked />
            <span>Accent downbeat</span>
          </label>
          <button type="button" id="metroTestBtn" title="Play a sample click">Test click</button>
        </div>
      </div>

      <div class="seek-row">
        <span class="time" id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" />
        <span class="time" id="tDur">0:00</span>
      </div>

      <div class="presets" id="presets"></div>
      <div class="stems" id="stems"></div>
      <div class="footer-note" id="status">Loading stems…</div>
    </div>
  </div>

  <script>
    const BOOT = __BOOT_JSON__;

    const STEM_ORDER = BOOT.stem_order || ["vocals", "drums", "bass", "guitar", "piano", "other"];
    const PRESETS = [
      { id: "all", label: "All on", mute: [] },
      { id: "guitarist", label: "Guitarist", mute: ["guitar"] },
      { id: "drummer", label: "Drummer", mute: ["drums"] },
      { id: "singer", label: "Singer", mute: ["vocals"] },
      { id: "bassist", label: "Bassist", mute: ["bass"] },
      { id: "pianist", label: "Pianist", mute: ["piano"] },
      { id: "karaoke", label: "Karaoke", mute: ["vocals"] },
    ];

    const tracks = {}; // name -> { audio, muted, solo, vol, originalSrc }
    let playing = false;
    let activePreset = "all";
    let seeking = false;
    let syncTimer = null;
    let uiTimer = null;
    let playbackRate = 1;
    let hqSpeed = 1; // speed baked into loaded stem files (1 = originals)
    let stretchBusy = false;
    let hqEnabled = false; // user toggle: Rubber Band HQ vs instant browser rate
    const MAX_KEY = 6;
    let keySemitones = 0; // UI key offset
    let bakedKey = 0; // semitones baked into currently loaded stems
    let pendingKey = null; // latest requested key while a transform is running
    let transformGen = 0; // ignore stale transforms
    const NOTE_SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const FLAT_TO_SHARP = {
      Db: "C#", Eb: "D#", Fb: "E", Gb: "F#", Ab: "G#", Bb: "A#", Cb: "B",
    };

    const playBtn = document.getElementById("playBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resetBtn = document.getElementById("resetBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const downloadStemsBtn = document.getElementById("downloadStemsBtn");
    const speedSel = document.getElementById("speedSel");
    const hqSpeedBtn = document.getElementById("hqSpeedBtn");
    const keyDownBtn = document.getElementById("keyDownBtn");
    const keyUpBtn = document.getElementById("keyUpBtn");
    const keyVal = document.getElementById("keyVal");
    const metroBtn = document.getElementById("metroBtn");
    const metroSettingsBtn = document.getElementById("metroSettingsBtn");
    const metroPanel = document.getElementById("metroPanel");
    const metroPanelClose = document.getElementById("metroPanelClose");
    const meterSel = document.getElementById("meterSel");
    const metroBpmEl = document.getElementById("metroBpm");
    const metroVol = document.getElementById("metroVol");
    const metroVolVal = document.getElementById("metroVolVal");
    const metroSound = document.getElementById("metroSound");
    const metroAccent = document.getElementById("metroAccent");
    const metroTestBtn = document.getElementById("metroTestBtn");
    const deviceSel = document.getElementById("deviceSel");
    const seekEl = document.getElementById("seek");
    const tCur = document.getElementById("tCur");
    const tDur = document.getElementById("tDur");
    const statusEl = document.getElementById("status");

    let metroOn = false;
    let metroTimer = null;
    let metroLastBeat = -1;
    let metroCtx = null;
    let metroVolume = 0.85;
    let metroSoundStyle = "wood";
    let metroAccentOn = true;
    let songBpm = Number(BOOT.bpm) || 0;
    let beat0 = Number((BOOT.bpm_meta && BOOT.bpm_meta.beat_0) || 0) || 0;
    let beatsPerBar = Number(BOOT.beats_per_bar) || 4;
    if (BOOT.time_signature === "6/8") beatsPerBar = 6;
    else if (BOOT.time_signature === "3/4") beatsPerBar = 3;
    else if (BOOT.time_signature === "2/4") beatsPerBar = 2;

    try {
      const savedVol = localStorage.getItem("metroVolume");
      if (savedVol != null) metroVolume = Math.max(0, Math.min(1, parseFloat(savedVol)));
      const savedSound = localStorage.getItem("metroSound");
      if (savedSound === "beep" || savedSound === "wood" || savedSound === "tick") metroSoundStyle = savedSound;
      const savedAccent = localStorage.getItem("metroAccent");
      if (savedAccent === "0" || savedAccent === "1") metroAccentOn = savedAccent === "1";
    } catch (_) {}

    function fmtKeyOffset(n) {
      if (n === 0) return "0";
      return (n > 0 ? "+" : "") + n;
    }

    function noteIndex(root) {
      if (!root) return -1;
      const r = FLAT_TO_SHARP[root] || root;
      return NOTE_SHARP.indexOf(r);
    }

    function transposeKeyName(keyName, semitones) {
      if (!keyName) return null;
      const m = String(keyName).match(/^([A-G](?:#|b)?)(m?)$/);
      if (!m) return null;
      const idx = noteIndex(m[1]);
      if (idx < 0) return null;
      const next = NOTE_SHARP[(idx + semitones + 120) % 12];
      return next + (m[2] || "");
    }

    function keyLabelText() {
      const orig = BOOT.key || null;
      if (!orig) {
        return keySemitones === 0 ? "…" : fmtKeyOffset(keySemitones);
      }
      const cur = transposeKeyName(orig, keySemitones) || orig;
      if (!keySemitones) return orig;
      return orig + "→" + cur;
    }

    function syncKeyUI() {
      if (keyVal) {
        keyVal.textContent = keyLabelText();
        keyVal.title = BOOT.key
          ? (keySemitones
              ? "Original " + BOOT.key + " · " + fmtKeyOffset(keySemitones) + " semitones"
              : "Detected key " + BOOT.key)
          : (keySemitones
              ? fmtKeyOffset(keySemitones) + " semitones (detect key from song hub)"
              : "Detect chords/key from song hub to see key name");
      }
      // Keep −/+ usable while playing; only lock at range edges
      if (keyDownBtn) keyDownBtn.disabled = keySemitones <= -MAX_KEY;
      if (keyUpBtn) keyUpBtn.disabled = keySemitones >= MAX_KEY;
    }

    function syncMetroUI() {
      if (meterSel) {
        meterSel.value = String(beatsPerBar);
        meterSel.disabled = !songBpm;
      }
      if (metroVol) metroVol.value = String(metroVolume);
      if (metroVolVal) metroVolVal.textContent = Math.round(metroVolume * 100) + "%";
      if (metroSound) metroSound.value = metroSoundStyle;
      if (metroAccent) metroAccent.checked = metroAccentOn;
      if (metroBpmEl) {
        const meterLabel =
          beatsPerBar === 6 ? "6/8" : beatsPerBar === 3 ? "3/4" : beatsPerBar === 2 ? "2/4" : "4/4";
        metroBpmEl.textContent = songBpm
          ? songBpm + " BPM · " + meterLabel
          : "No BPM — run Detect BPM on song hub";
      }
      if (metroBtn) {
        metroBtn.classList.toggle("on", metroOn);
        metroBtn.textContent = metroOn ? "Metronome: On" : "Metronome: Off";
        metroBtn.disabled = !songBpm;
        metroBtn.title = songBpm
          ? "Click track locked to song BPM (" + songBpm + ")"
          : "Run Detect BPM on the song hub first";
      }
      if (metroSettingsBtn) {
        metroSettingsBtn.classList.toggle("on", metroPanel && !metroPanel.hidden);
        metroSettingsBtn.disabled = false;
      }
    }

    function setMetroPanelOpen(open) {
      if (!metroPanel) return;
      metroPanel.hidden = !open;
      syncMetroUI();
    }

    function ensureMetroCtx() {
      if (!metroCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        metroCtx = new AC();
      }
      if (metroCtx.state === "suspended") metroCtx.resume().catch(() => {});
      return metroCtx;
    }

    function playMetroClick(isDownbeat) {
      const ctx = ensureMetroCtx();
      if (!ctx) return;
      const t0 = ctx.currentTime;
      const vol = Math.max(0, Math.min(1, metroVolume));
      if (vol < 0.01) return;
      const accent = isDownbeat && metroAccentOn;
      const peak = vol * (accent ? 1.0 : 0.72);

      if (metroSoundStyle === "wood") {
        // Noise burst + short tone = louder wood-block feel
        const dur = accent ? 0.09 : 0.07;
        const bufLen = Math.floor(ctx.sampleRate * dur);
        const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) {
          const env = Math.exp(-i / (ctx.sampleRate * (accent ? 0.018 : 0.012)));
          data[i] = (Math.random() * 2 - 1) * env;
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buf;
        const bp = ctx.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = accent ? 1800 : 1200;
        bp.Q.value = 2.2;
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(peak * 1.35, t0);
        ng.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        noise.connect(bp);
        bp.connect(ng);
        ng.connect(ctx.destination);
        noise.start(t0);
        noise.stop(t0 + dur);

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = accent ? 880 : 660;
        gain.gain.setValueAtTime(peak * 0.55, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.06);
        return;
      }

      if (metroSoundStyle === "tick") {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(accent ? 2200 : 1600, t0);
        osc.frequency.exponentialRampToValueAtTime(accent ? 900 : 700, t0 + 0.03);
        gain.gain.setValueAtTime(peak, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.05);
        return;
      }

      // beep — loud square click
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.value = accent ? 1400 : 980;
      gain.gain.setValueAtTime(peak, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + (accent ? 0.08 : 0.055));
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.09);
    }

    function metroMediaBeatIndex(mediaT) {
      if (!(songBpm > 0)) return -1;
      const beatDur = 60 / songBpm;
      const rel = mediaT - beat0;
      if (rel < -beatDur * 0.25) return -1;
      return Math.floor((rel + 1e-6) / beatDur);
    }

    function metroPoll() {
      if (!metroOn || !playing || !(songBpm > 0)) return;
      const a = masterAudio();
      if (!a) return;
      const idx = metroMediaBeatIndex(a.currentTime || 0);
      if (idx < 0 || idx === metroLastBeat) return;
      metroLastBeat = idx;
      const inBar = idx % beatsPerBar;
      // 6/8: accent 1 and 4 (indices 0 and 3)
      const down = inBar === 0 || (beatsPerBar === 6 && inBar === 3);
      playMetroClick(down);
    }

    function startMetro() {
      stopMetroPoll();
      metroLastBeat = -1;
      if (!metroOn || !(songBpm > 0)) return;
      ensureMetroCtx();
      metroTimer = setInterval(metroPoll, 25);
    }

    function stopMetroPoll() {
      if (metroTimer) clearInterval(metroTimer);
      metroTimer = null;
    }

    function toggleMetro() {
      if (!songBpm) {
        setStatus("Detect BPM on the song hub first, then reopen the mixer.");
        return;
      }
      metroOn = !metroOn;
      syncMetroUI();
      if (metroOn && playing) startMetro();
      else stopMetroPoll();
      setStatus(metroOn ? "Metronome on · " + songBpm + " BPM" : "Metronome off");
    }

    function onMeterChange() {
      beatsPerBar = parseInt(meterSel.value, 10) || 4;
      metroLastBeat = -1;
      syncMetroUI();
    }

    function saveMetroPrefs() {
      try {
        localStorage.setItem("metroVolume", String(metroVolume));
        localStorage.setItem("metroSound", metroSoundStyle);
        localStorage.setItem("metroAccent", metroAccentOn ? "1" : "0");
      } catch (_) {}
    }

    function onMetroVolInput() {
      metroVolume = parseFloat(metroVol.value) || 0;
      if (metroVolVal) metroVolVal.textContent = Math.round(metroVolume * 100) + "%";
      saveMetroPrefs();
    }

    function onMetroSoundChange() {
      metroSoundStyle = metroSound.value || "wood";
      saveMetroPrefs();
    }

    function onMetroAccentChange() {
      metroAccentOn = !!metroAccent.checked;
      saveMetroPrefs();
    }

    function setTransformBusy(busy) {
      stretchBusy = busy;
      if (speedSel) speedSel.disabled = busy;
      if (hqSpeedBtn) hqSpeedBtn.disabled = busy;
      syncKeyUI();
    }

    function needsServerFiles() {
      return keySemitones !== 0 || (hqEnabled && Math.abs(playbackRate - 1) >= 1e-6);
    }

    function serverSpeedForBake() {
      return hqEnabled ? playbackRate : 1;
    }

    function fmt(sec) {
      if (!isFinite(sec) || sec < 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ":" + String(s).padStart(2, "0");
    }

    function setStatus(msg) {
      statusEl.textContent = msg || "";
    }

    function syncHqButton() {
      if (!hqSpeedBtn) return;
      hqSpeedBtn.classList.toggle("on", hqEnabled);
      hqSpeedBtn.textContent = hqEnabled ? "HQ speed: On" : "HQ speed: Off";
    }

    function originalStemMap() {
      const orig = {};
      for (const [name, t] of Object.entries(tracks)) orig[name] = t.originalSrc;
      return orig;
    }

    function applyRate() {
      // When HQ stems are loaded for this speed, play at 1× (stretch already applied)
      const rate =
        hqEnabled && Math.abs(hqSpeed - playbackRate) < 1e-6 ? 1 : playbackRate;
      for (const t of Object.values(tracks)) {
        t.audio.playbackRate = rate;
        try {
          t.audio.preservesPitch = true;
          t.audio.mozPreservesPitch = true;
          t.audio.webkitPreservesPitch = true;
        } catch (_) {}
      }
    }

    function currentRatio() {
      const a = masterAudio();
      const dur = duration();
      if (!a || !(dur > 0)) return 0;
      return Math.max(0, Math.min(1, (a.currentTime || 0) / dur));
    }

    async function loadStemUrls(stemMap, keepRatio) {
      // Capture position while still playing — only pause at the swap moment
      const ratio = keepRatio ? currentRatio() : 0;
      const wasPlaying = playing;
      const loads = [];
      for (const [name, url] of Object.entries(stemMap)) {
        if (!tracks[name]) continue;
        const a = tracks[name].audio;
        // Preload into a temp Audio so current playback can continue until swap
        loads.push(
          new Promise((resolve) => {
            const probe = new Audio();
            probe.preload = "auto";
            const done = () => {
              probe.removeEventListener("canplaythrough", done);
              probe.removeEventListener("loadedmetadata", done);
              probe.removeEventListener("error", done);
              resolve(url);
            };
            probe.addEventListener("canplaythrough", done);
            probe.addEventListener("loadedmetadata", done);
            probe.addEventListener("error", done);
            probe.src = url;
            probe.load();
          })
        );
      }
      await Promise.all(loads);
      // Brief pause only for source swap
      if (wasPlaying) pauseAll();
      for (const [name, url] of Object.entries(stemMap)) {
        if (!tracks[name]) continue;
        const a = tracks[name].audio;
        a.src = url;
        a.load();
      }
      // Wait for metadata on swapped elements
      await Promise.all(
        Object.values(tracks).map(
          (t) =>
            new Promise((resolve) => {
              if (t.audio.readyState >= 1) return resolve();
              const done = () => {
                t.audio.removeEventListener("loadedmetadata", done);
                t.audio.removeEventListener("error", done);
                resolve();
              };
              t.audio.addEventListener("loadedmetadata", done);
              t.audio.addEventListener("error", done);
            })
        )
      );
      applyRate();
      if (keepRatio) seekToRatio(ratio);
      else updateSeekUI();
      if (wasPlaying) await playAll();
    }

    async function restoreOriginalStems(statusMsg) {
      if (hqSpeed === 1 && bakedKey === 0) {
        applyRate();
        if (statusMsg) setStatus(statusMsg);
        return;
      }
      setTransformBusy(true);
      setStatus("Restoring original stems…");
      try {
        await loadStemUrls(originalStemMap(), true);
        hqSpeed = 1;
        bakedKey = 0;
        if (statusMsg) setStatus(statusMsg);
      } catch (e) {
        setStatus("Restore failed: " + e.message);
      } finally {
        setTransformBusy(false);
      }
    }

    async function prepareTransformed(statusHint) {
      const bakeSpeed = serverSpeedForBake();
      const key = keySemitones;
      const gen = ++transformGen;
      if (!needsServerFiles()) {
        await restoreOriginalStems(
          statusHint ||
            (BOOT.key ? "Playing in " + BOOT.key : "Playing original key · 1×")
        );
        applyRate();
        return;
      }
      setTransformBusy(true);
      const bits = [];
      const name = BOOT.key ? transposeKeyName(BOOT.key, key) : null;
      if (name) bits.push(name);
      else if (key) bits.push("key " + fmtKeyOffset(key));
      if (hqEnabled && Math.abs(bakeSpeed - 1) >= 1e-6) bits.push("HQ " + bakeSpeed + "×");
      setStatus("Transposing" + (playing ? " while playing" : "") + " → " + (bits.join(" · ") || "stems") + "…");
      try {
        const res = await fetch("/api/jobs/" + encodeURIComponent(BOOT.job_id) + "/stretch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ speed: bakeSpeed, semitones: key }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || res.statusText);
        // Stale request (user clicked again) — skip swap
        if (gen !== transformGen) return;
        await loadStemUrls(data.stems || {}, true);
        if (gen !== transformGen) return;
        hqSpeed = bakeSpeed;
        bakedKey = key;
        const eng = data.engine || "unknown";
        const msgBits = [];
        if (name) msgBits.push(name + (BOOT.key && key ? " (" + BOOT.key + " " + fmtKeyOffset(key) + ")" : ""));
        else if (key) msgBits.push("key " + fmtKeyOffset(key));
        if (hqEnabled && Math.abs(playbackRate - 1) >= 1e-6) {
          msgBits.push("HQ " + playbackRate + "× via " + eng);
        } else if (Math.abs(playbackRate - 1) >= 1e-6) {
          msgBits.push(playbackRate + "× browser");
        }
        setStatus((msgBits.join(" · ") || "Ready") + " — keep playing, change key anytime.");
      } catch (e) {
        if (gen !== transformGen) return;
        hqSpeed = 1;
        bakedKey = 0;
        keySemitones = 0;
        syncKeyUI();
        try { await loadStemUrls(originalStemMap(), true); } catch (_) {}
        applyRate();
        setStatus("Transform failed (" + e.message + ") — back to original.");
      } finally {
        if (gen === transformGen) setTransformBusy(false);
        // Apply latest queued key change
        if (pendingKey !== null && pendingKey !== bakedKey) {
          keySemitones = pendingKey;
          pendingKey = null;
          syncKeyUI();
          await prepareTransformed();
        } else {
          pendingKey = null;
        }
      }
    }

    async function setSpeed(rate) {
      const next = Math.max(0.25, Math.min(2, Number(rate) || 1));
      playbackRate = next;
      if (speedSel) speedSel.value = String(playbackRate);
      if (!BOOT.job_id || stretchBusy) {
        applyRate();
        return;
      }

      if (!needsServerFiles()) {
        if (hqSpeed !== 1 || bakedKey !== 0) await restoreOriginalStems();
        applyRate();
        setStatus(
          Math.abs(next - 1) < 1e-6
            ? "Playing at 1×" + (BOOT.key ? " · " + (transposeKeyName(BOOT.key, keySemitones) || BOOT.key) : "")
            : "Playing at " + next + "× (browser — turn on HQ speed for better quality)."
        );
        return;
      }

      if (!hqEnabled && keySemitones !== 0) {
        if (bakedKey !== keySemitones || hqSpeed !== 1) {
          await prepareTransformed();
        } else {
          applyRate();
          const name = transposeKeyName(BOOT.key, keySemitones);
          setStatus((name || "Key " + fmtKeyOffset(keySemitones)) + " · " + next + "× browser");
        }
        return;
      }

      await prepareTransformed();
    }

    async function toggleHqSpeed() {
      if (stretchBusy) return;
      hqEnabled = !hqEnabled;
      syncHqButton();
      if (!BOOT.job_id) return;

      if (!hqEnabled) {
        if (keySemitones !== 0) {
          await prepareTransformed();
        } else {
          await restoreOriginalStems(
            Math.abs(playbackRate - 1) < 1e-6
              ? "HQ speed Off"
              : "HQ speed Off — using browser " + playbackRate + "×"
          );
          applyRate();
        }
        return;
      }

      if (Math.abs(playbackRate - 1) < 1e-6 && keySemitones === 0) {
        setStatus("HQ speed On — pick a speed other than 1× to process.");
        return;
      }
      await prepareTransformed();
    }

    async function setKey(delta) {
      if (!BOOT.job_id) return;
      const next = Math.max(-MAX_KEY, Math.min(MAX_KEY, keySemitones + delta));
      if (next === keySemitones && !stretchBusy) return;
      keySemitones = next;
      syncKeyUI();
      // Update label immediately; bake in background while audio keeps playing
      if (stretchBusy) {
        pendingKey = next;
        setStatus("Queued " + keyLabelText() + "…");
        return;
      }
      await prepareTransformed();
      applyRate();
    }

    async function ensureKeyDetected() {
      if (BOOT.key || !BOOT.job_id) {
        syncKeyUI();
        return;
      }
      try {
        const res = await fetch("/api/jobs/" + encodeURIComponent(BOOT.job_id) + "/key", {
          method: "POST",
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.key) {
          BOOT.key = data.key;
          BOOT.key_meta = data;
          syncKeyUI();
          setStatus("Detected key " + data.key + " — use Key −/+ while playing.");
        } else {
          syncKeyUI();
        }
      } catch (_) {
        syncKeyUI();
      }
    }

    function mixPayload() {
      const volumes = {};
      const muted = {};
      const solo = {};
      for (const [name, t] of Object.entries(tracks)) {
        volumes[name] = t.vol;
        muted[name] = !!t.muted;
        solo[name] = !!t.solo;
      }
      return { volumes, muted, solo, speed: playbackRate };
    }

    async function saveDownload(res, fallbackName) {
      if (!res.ok) {
        let msg = res.statusText;
        try {
          const j = await res.json();
          msg = j.detail || msg;
        } catch (_) {
          try { msg = await res.text(); } catch (__) {}
        }
        throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      }
      const blob = await res.blob();
      const cd = res.headers.get("Content-Disposition") || "";
      const m = /filename=\"?([^\";]+)\"?/.exec(cd);
      const fname = (m && m[1]) || fallbackName;
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      return fname;
    }

    async function downloadMix() {
      if (!BOOT.job_id) return;
      downloadBtn.disabled = true;
      setStatus("Rendering mix MP3…");
      try {
        const res = await fetch("/api/jobs/" + encodeURIComponent(BOOT.job_id) + "/export", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(mixPayload()),
        });
        const fname = await saveDownload(res, "mix.mp3");
        setStatus("Downloaded " + fname + " (" + playbackRate + "×, current mute/vols).");
      } catch (e) {
        setStatus("Download failed: " + e.message);
      } finally {
        downloadBtn.disabled = false;
      }
    }

    async function downloadStems() {
      if (!BOOT.job_id) return;
      downloadStemsBtn.disabled = true;
      setStatus("Packing stems ZIP…");
      try {
        const res = await fetch(
          "/api/jobs/" + encodeURIComponent(BOOT.job_id) + "/stems.zip"
        );
        const fname = await saveDownload(res, "stems.zip");
        setStatus("Downloaded " + fname + " (folder with all stem MP3s).");
      } catch (e) {
        setStatus("Download stems failed: " + e.message);
      } finally {
        downloadStemsBtn.disabled = false;
      }
    }

    function anySolo() {
      return Object.values(tracks).some((t) => t.solo);
    }

    function trackAudible(t) {
      if (t.muted) return false;
      if (anySolo() && !t.solo) return false;
      return true;
    }

    function activeStemNames() {
      return STEM_ORDER.filter((n) => tracks[n] && trackAudible(tracks[n]));
    }

    function activeTracks() {
      return activeStemNames().map((n) => tracks[n]);
    }

    function waitForBuffer(audio, timeoutMs) {
      timeoutMs = timeoutMs || 45000;
      if (audio.readyState >= 3) return Promise.resolve();
      return new Promise((resolve, reject) => {
        let done = false;
        const finish = (ok) => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          audio.removeEventListener("canplaythrough", onReady);
          audio.removeEventListener("canplay", onReady);
          audio.removeEventListener("progress", onReady);
          ok ? resolve() : reject(new Error("buffer timeout"));
        };
        const onReady = () => {
          if (audio.readyState >= 3) finish(true);
          else if (audio.readyState >= 2 && audio.buffered.length) {
            const end = audio.buffered.end(audio.buffered.length - 1);
            if (end - audio.currentTime >= 2 || audio.duration - audio.currentTime < 2) finish(true);
          }
        };
        const timer = setTimeout(() => {
          if (audio.readyState >= 2) finish(true);
          else finish(false);
        }, timeoutMs);
        audio.addEventListener("canplaythrough", onReady);
        audio.addEventListener("canplay", onReady);
        audio.addEventListener("progress", onReady);
        onReady();
      });
    }

    function applyAudibility() {
      const actives = activeStemNames();
      const master = masterAudio();
      const t0 = master ? master.currentTime : 0;

      for (const [name, t] of Object.entries(tracks)) {
        const on = actives.includes(name);
        t.audio.volume = Math.min(1, Math.max(0, t.vol));
        t.audio.muted = false;

        if (!on) {
          t.audio.pause();
          t.audio.preload = "none";
          continue;
        }

        t.audio.preload = "auto";
        if (Math.abs(t.audio.currentTime - t0) > 0.05) {
          t.audio.currentTime = t0;
        }
      }
      refreshButtons();
    }

    async function resyncActivePlayback() {
      if (!playing) {
        applyAudibility();
        return;
      }
      const names = activeStemNames();
      if (!names.length) {
        pauseAll();
        setStatus("All stems muted.");
        return;
      }
      const t0 = tracks[names[0]].audio.currentTime;
      applyAudibility();
      const audios = names.map((n) => tracks[n].audio);
      for (const a of audios) {
        if (Math.abs(a.currentTime - t0) > 0.05) a.currentTime = t0;
      }
      try {
        applyRate();
        await Promise.all(audios.map((a) => waitForBuffer(a, 30000)));
        await Promise.all(audios.map((a) => a.play()));
      } catch (_) {
        setStatus("Some stems still buffering — may stutter on slow links.");
      }
    }

    function onMixChange() {
      if (playing) resyncActivePlayback();
      else applyAudibility();
    }

    function masterAudio() {
      const names = activeStemNames();
      if (names.length) return tracks[names[0]].audio;
      const any = STEM_ORDER.filter((n) => tracks[n]);
      return any.length ? tracks[any[0]].audio : null;
    }

    function duration() {
      const a = masterAudio();
      return a && isFinite(a.duration) ? a.duration : 0;
    }

    function clearTimers() {
      if (syncTimer) clearInterval(syncTimer);
      if (uiTimer) clearInterval(uiTimer);
      syncTimer = uiTimer = null;
      stopMetroPoll();
    }

    function startTimers() {
      clearTimers();
      syncTimer = setInterval(() => {
        const actives = activeTracks();
        if (actives.length < 2 || !playing) return;
        const master = actives[0].audio;
        for (let i = 1; i < actives.length; i++) {
          const a = actives[i].audio;
          if (Math.abs(a.currentTime - master.currentTime) > 0.12) {
            a.currentTime = master.currentTime;
          }
        }
      }, 500);
      uiTimer = setInterval(updateSeekUI, 200);
      if (metroOn) startMetro();
    }

    function updateSeekUI() {
      if (seeking) return;
      const a = masterAudio();
      if (!a) return;
      const dur = duration();
      tDur.textContent = fmt(dur);
      tCur.textContent = fmt(a.currentTime || 0);
      if (dur > 0) seekEl.value = String(Math.round((a.currentTime / dur) * 1000));
    }

    async function playAll() {
      const actives = activeTracks();
      if (!actives.length) {
        setStatus("Unmute at least one stem to play.");
        return;
      }
      applyAudibility();
      playBtn.disabled = true;
      setStatus("Buffering active stems…");
      try {
        applyRate();
        const audios = actives.map((t) => t.audio);
        const t0 = audios[0].currentTime || 0;
        for (const a of audios) {
          if (Math.abs(a.currentTime - t0) > 0.05) a.currentTime = t0;
        }
        await Promise.all(audios.map((a) => waitForBuffer(a, 45000)));
        await Promise.all(audios.map((a) => a.play()));
        playing = true;
        playBtn.textContent = "Pause";
        startTimers();
        setStatus(
          "Playing " +
            audios.length +
            " stem(s) at " +
            playbackRate +
            "× — muted stems paused to save bandwidth."
        );
      } catch (e) {
        playing = false;
        playBtn.textContent = "Play";
        setStatus("Play failed — wait for buffer or try Wi‑Fi. " + (e.message || e));
      } finally {
        playBtn.disabled = false;
      }
    }

    function pauseAll() {
      for (const t of Object.values(tracks)) t.audio.pause();
      playing = false;
      playBtn.textContent = "Play";
      clearTimers();
      setStatus("Paused");
    }

    function stopAll() {
      for (const t of Object.values(tracks)) {
        t.audio.pause();
        t.audio.currentTime = 0;
      }
      playing = false;
      playBtn.textContent = "Play";
      clearTimers();
      updateSeekUI();
      setStatus("Stopped");
    }

    function togglePlay() {
      if (playing) pauseAll();
      else playAll();
    }

    function seekToRatio(ratio) {
      const dur = duration();
      if (!(dur > 0)) return;
      const t = Math.max(0, Math.min(dur, ratio * dur));
      for (const tr of Object.values(tracks)) tr.audio.currentTime = t;
      metroLastBeat = -1;
      updateSeekUI();
    }

    function refreshButtons() {
      for (const name of Object.keys(tracks)) {
        const muteBtn = document.getElementById("mute-" + name);
        const soloBtn = document.getElementById("solo-" + name);
        if (muteBtn) muteBtn.classList.toggle("on", tracks[name].muted);
        if (soloBtn) soloBtn.classList.toggle("on", tracks[name].solo);
      }
      document.querySelectorAll(".presets button").forEach((el) => {
        el.classList.toggle("on", el.dataset.id === activePreset);
      });
    }

    function applyPreset(id) {
      const p = PRESETS.find((x) => x.id === id);
      if (!p) return;
      activePreset = id;
      for (const [name, t] of Object.entries(tracks)) {
        t.muted = p.mute.includes(name);
        t.solo = false;
      }
      onMixChange();
    }

    function render() {
      document.getElementById("title").textContent = BOOT.title || "Practice player";
      document.title = (BOOT.title || "Player") + " · Practice Stems";
      const hub = document.getElementById("hubLink");
      if (hub && BOOT.hub_url) {
        hub.href = BOOT.hub_url;
        hub.style.display = "";
      }

      const presetsEl = document.getElementById("presets");
      presetsEl.innerHTML = "";
      for (const p of PRESETS) {
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.id = p.id;
        b.textContent = p.label;
        b.onclick = () => applyPreset(p.id);
        presetsEl.appendChild(b);
      }

      const stemsEl = document.getElementById("stems");
      stemsEl.innerHTML = "";
      for (const name of STEM_ORDER) {
        if (!tracks[name]) continue;
        const row = document.createElement("div");
        row.className = "stem";
        row.innerHTML =
          '<div class="name">' + name + "</div>" +
          '<input type="range" min="0" max="1" step="0.01" value="' + tracks[name].vol + '" id="vol-' + name + '" />' +
          '<div class="vol" id="volval-' + name + '">100%</div>' +
          '<button type="button" class="mute" id="mute-' + name + '">Mute</button>' +
          '<button type="button" class="solo" id="solo-' + name + '">Solo</button>';
        stemsEl.appendChild(row);

        document.getElementById("vol-" + name).oninput = (e) => {
          tracks[name].vol = parseFloat(e.target.value);
          document.getElementById("volval-" + name).textContent =
            Math.round(tracks[name].vol * 100) + "%";
          tracks[name].audio.volume = Math.min(1, Math.max(0, tracks[name].vol));
          activePreset = "";
          refreshButtons();
        };
        document.getElementById("mute-" + name).onclick = () => {
          tracks[name].muted = !tracks[name].muted;
          if (tracks[name].muted) tracks[name].solo = false;
          activePreset = "";
          onMixChange();
        };
        document.getElementById("solo-" + name).onclick = () => {
          tracks[name].solo = !tracks[name].solo;
          if (tracks[name].solo) tracks[name].muted = false;
          activePreset = "";
          onMixChange();
        };
      }
      refreshButtons();
    }

    function init() {
      const stemMap = BOOT.stems || {};
      const names = STEM_ORDER.filter((n) => stemMap[n]);
      if (!names.length) {
        setStatus("No stems found for this job.");
        playBtn.disabled = true;
        return;
      }

      for (const name of names) {
        const audio = new Audio();
        audio.preload = "metadata";
        audio.src = stemMap[name];
        audio.addEventListener("ended", () => {
          // When master ends, stop all
          if (name === names[0]) stopAll();
        });
        tracks[name] = { audio, muted: false, solo: false, vol: 1, originalSrc: stemMap[name] };
      }

      // Play waits for buffer on active stems only; muted stems stay paused.
      playBtn.disabled = false;
      stopBtn.disabled = false;
      resetBtn.disabled = false;
      downloadBtn.disabled = false;
      downloadStemsBtn.disabled = false;
      speedSel.disabled = false;
      if (hqSpeedBtn) hqSpeedBtn.disabled = false;
      syncHqButton();
      syncKeyUI();
      syncMetroUI();
      applyRate();
      render();
      applyAudibility();
      setStatus("Ready — " + names.length + " stems. Change Key while playing.");
      ensureKeyDetected();

      // Update duration when metadata arrives
      const master = tracks[names[0]].audio;
      master.addEventListener("loadedmetadata", updateSeekUI);
    }

    function teardownAndGoHome() {
      // Unload audio so navigation isn't blocked by buffering
      try {
        clearTimers();
        for (const t of Object.values(tracks)) {
          t.audio.pause();
          t.audio.removeAttribute("src");
          t.audio.load();
        }
      } catch (_) {}
      window.location.replace("/");
    }

    playBtn.onclick = togglePlay;
    stopBtn.onclick = stopAll;
    resetBtn.onclick = () => applyPreset("all");
    downloadBtn.onclick = downloadMix;
    downloadStemsBtn.onclick = downloadStems;
    speedSel.onchange = () => setSpeed(speedSel.value);
    if (hqSpeedBtn) hqSpeedBtn.onclick = toggleHqSpeed;
    if (keyDownBtn) keyDownBtn.onclick = () => setKey(-1);
    if (keyUpBtn) keyUpBtn.onclick = () => setKey(1);
    if (metroBtn) metroBtn.onclick = toggleMetro;
    if (metroSettingsBtn) {
      metroSettingsBtn.onclick = () => {
        const open = metroPanel && metroPanel.hidden;
        setMetroPanelOpen(!!open);
      };
    }
    if (metroPanelClose) metroPanelClose.onclick = () => setMetroPanelOpen(false);
    if (meterSel) {
      if (beatsPerBar) meterSel.value = String(beatsPerBar);
      meterSel.onchange = onMeterChange;
    }
    if (metroVol) {
      metroVol.value = String(metroVolume);
      metroVol.oninput = onMetroVolInput;
    }
    if (metroSound) {
      metroSound.value = metroSoundStyle;
      metroSound.onchange = onMetroSoundChange;
    }
    if (metroAccent) {
      metroAccent.checked = metroAccentOn;
      metroAccent.onchange = onMetroAccentChange;
    }
    if (metroTestBtn) {
      metroTestBtn.onclick = () => {
        playMetroClick(true);
        setTimeout(() => playMetroClick(false), 220);
      };
    }
    syncMetroUI();
    if (deviceSel) {
      try {
        const saved = localStorage.getItem("practiceDevice");
        if (saved === "cpu" || saved === "auto") deviceSel.value = saved;
      } catch (_) {}
      deviceSel.onchange = () => {
        try {
          localStorage.setItem("practiceDevice", deviceSel.value);
        } catch (_) {}
        setStatus("Stem device preference: " + deviceSel.value + " (used next time you run stems).");
      };
      // Show detected compute
      fetch("/api/device")
        .then((r) => r.json())
        .then((d) => {
          if (d && d.label) {
            const opt = deviceSel.querySelector('option[value="auto"]');
            if (opt) opt.textContent = "Auto (" + d.label + ")";
          }
        })
        .catch(() => {});
    }
    document.getElementById("homeBtn").onclick = teardownAndGoHome;

    seekEl.addEventListener("pointerdown", () => { seeking = true; });
    seekEl.addEventListener("pointerup", () => {
      seeking = false;
      seekToRatio(parseInt(seekEl.value, 10) / 1000);
    });
    seekEl.addEventListener("change", () => {
      seekToRatio(parseInt(seekEl.value, 10) / 1000);
      seeking = false;
    });

    init();
  </script>
</body>
</html>
